[project]
name = "quickqueue-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "abirbahri", email = "abir.bahri.1@ulaval.ca" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "sqlalchemy>=2.0.53",
    "uvicorn[standard]>=0.53.0",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
